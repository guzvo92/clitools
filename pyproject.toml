[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "statuslinedex"
version = "0.1.0"
description = "One status line for Claude Code, MiniMax Code (mcode) and Codex: model, context and plan quota with time to reset"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []
keywords = ["claude-code", "codex", "minimax", "mcode", "statusline", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
]

[project.scripts]
statuslinedex = "statuslinedex:main"

[tool.setuptools]
py-modules = ["statuslinedex"]
